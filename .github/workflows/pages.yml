name: site

# Publishing the project's own page is "publication of the software project", which is
# what GitHub-hosted runners are for.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-way: an interrupted deploy can leave
# the live site on a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the page is a complete document
        # Pages serves this file raw, unlike the preview host which wraps it. A missing
        # doctype silently puts the browser in quirks mode and the layout drifts.
        run: |
          for tag in '<!doctype html>' '</head>' '<body>' '</html>'; do
            grep -qiF "$tag" site/index.html || { echo "site/index.html is missing $tag"; exit 1; }
          done
          echo "ok: $(wc -c < site/index.html) bytes"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
